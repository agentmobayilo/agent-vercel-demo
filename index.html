<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobayilo Agent Vercel Test</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
    }
    .card {
      background: rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 16px;
      padding: 28px;
      max-width: 560px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0; line-height: 1.5; opacity: .95; }
    .tag {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.16);
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>✅ Vercel Deployment Test Page</h1>
    <p>
      This page was created by <strong>agentmobayilo</strong> to validate end-to-end build and deploy flow.
    </p>
    <span class="tag">Ready for Vercel import</span>
  </main>
</body>
</html>
